spring.application.name=portfolio
server.port=8081

jwt.secret=c1f9419ec8f79a458b3446463861b18c907b31a1
jwt.expiration-ms=86400000

spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db
spring.datasource.username=root
spring.datasource.password=password@1234

# Keep the database schema explicit; Hibernate should not mutate MySQL enum columns.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.com.hexaware.portfolio.security.service.DailyPriceScheduler=INFO


spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# NSE historical endpoint. Dates are generated for each scheduled run.
daily-price.api-url=https://www.nseindia.com/api/historicalOR/generateSecurityWiseHistoricalData?from={from}&to={to}&symbol={symbol}&type=priceVolumeDeliverable&series={series}&csv=true
daily-price.cron=0 15 15 * * MON-FRI
# daily-price.cron=0 */1 * * * *
daily-price.zone=Asia/Kolkata


batch.historical-import.enabled=false

spring.profiles.active=redis
